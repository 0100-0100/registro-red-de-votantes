<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="inicio.html">Registro red de votantes</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item">
                    <a class="nav-link active" href="perfil.html">
                        <i class="bi bi-person"></i> Perfil
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="referidos.html">
                        <i class="bi bi-people"></i> Referidos
                    </a>
                </li>
                <li class="nav-item">
                    <form method="post" action="login.html" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm ms-2">
                            <i class="bi bi-box-arrow-right"></i> Cerrar sesión
                        </button>
                    </form>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-6 col-12">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h4 class="card-title text-center mb-4">Cambiar Contraseña</h4>

                    

                    <form method="post" novalidate="">

                        <!-- Old Password -->
                        <div class="mb-3">
                            <label for="id_old_password" class="form-label">Contraseña Actual</label>
                            <input type="password" name="old_password" class="form-control" id="id_old_password" placeholder="Contraseña actual" required="">
                            <div class="invalid-feedback">
                                Ingrese su contraseña actual
                            </div>
                        </div>

                        <!-- New Password -->
                        <div class="mb-3">
                            <label for="id_new_password1" class="form-label">Nueva Contraseña</label>
                            <input type="password" name="new_password1" class="form-control" id="id_new_password1" placeholder="Nueva contraseña" required="">
                            <div class="invalid-feedback">
                                Ingrese su nueva contraseña
                            </div>
                        </div>

                        <!-- Confirm New Password -->
                        <div class="mb-4">
                            <label for="id_new_password2" class="form-label">Confirmar Nueva Contraseña</label>
                            <input type="password" name="new_password2" class="form-control" id="id_new_password2" placeholder="Confirmar nueva contraseña" required="">
                            <div class="invalid-feedback">
                                Confirme su nueva contraseña
                            </div>
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex gap-2">
                            <a href="perfil.html" class="btn btn-outline-secondary flex-fill">
                                Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary flex-fill">
                                <i class="bi bi-key"></i> Cambiar Contraseña
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
